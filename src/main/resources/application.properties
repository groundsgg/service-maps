quarkus.application.name=service-maps
quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=maps}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
quarkus.flyway.schemas=maps
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true

# Keycloak bearer tokens. Two kinds of caller, one mechanism:
#   - a human, through the portal's BFF proxy, which forwards the session token
#   - the build server, with its own service-account client credentials
#
# Deliberately NOT the projected-ServiceAccount-token pattern the gameplay
# services use: the build server runs on the grounds-dev spoke and this service
# runs on core, and a k8s token issued by one cluster does not verify against the
# other cluster's JWKS. Keycloak is the identity both clusters already share.
quarkus.oidc.enabled=${GROUNDS_OIDC_ENABLED:true}
quarkus.oidc.auth-server-url=${GROUNDS_OIDC_SERVER_URL:https://account.grounds.gg/realms/grounds}
quarkus.oidc.client-id=${GROUNDS_OIDC_CLIENT_ID:service-maps}
quarkus.oidc.application-type=service
# The identity's roles come from the `groups` claim, which is the claim Keycloak already
# puts in the token and the one grounds-portal authorises on. Reusing it means an operator
# grants access to this service the same way they grant it anywhere else.
quarkus.oidc.roles.role-claim-path=groups

# Which group may do what. Configuration rather than code, so adding a build team does not
# need a release. Ownership is separate and needs no group: a subject may always act inside
# its own `u/<sub>` namespace.
#
# Going live is deliberately narrower than publishing: publishing changes nothing players
# see, moving a pin changes what everyone loads.
grounds.maps.authz.author-groups=${MAPS_AUTHOR_GROUPS:grounds-staff,map-authors}
grounds.maps.authz.publish-groups=${MAPS_PUBLISH_GROUPS:grounds-staff,map-authors}
grounds.maps.authz.golive-groups=${MAPS_GOLIVE_GROUPS:grounds-staff}
grounds.maps.authz.review-groups=${MAPS_REVIEW_GROUPS:grounds-staff,map-reviewers}

# OpenTelemetry — a span per request to Alloy. Off locally because there is no
# Alloy to talk to; the deployed chart sets OTEL_SDK_DISABLED=false.
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}

# R2. Two buckets: uploads and unpublished blobs land in the private one, and promoting
# an object into the public one is a server-side copy only the approval path performs.
# The EU-jurisdiction endpoint host differs from the default one, so it is configured
# rather than derived.
grounds.maps.r2.endpoint=${MAPS_S3_ENDPOINT:http://localhost:9100}
grounds.maps.r2.region=${MAPS_S3_REGION:auto}
grounds.maps.r2.access-key=${MAPS_R2_ACCESS_KEY_ID:dev}
grounds.maps.r2.secret-key=${MAPS_R2_SECRET_ACCESS_KEY:devsecret}
grounds.maps.r2.private-bucket=${MAPS_R2_PRIVATE_BUCKET:grounds-maps}
grounds.maps.r2.public-bucket=${MAPS_R2_PUBLIC_BUCKET:grounds-maps-public}
