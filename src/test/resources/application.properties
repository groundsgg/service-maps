# No Keycloak in a test run; @TestSecurity supplies the identity instead.
quarkus.oidc.enabled=false
quarkus.otel.sdk.disabled=true

# The datasource URL is injected by the Postgres test resource, which starts a
# container per test class. Flyway then migrates into the `maps` schema exactly as
# it does in production — the migration is under test too, not stubbed out.
quarkus.flyway.migrate-at-start=true
