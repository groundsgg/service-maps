name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  packages: write
  contents: write
  actions: write

jobs:
  reusable:
    uses: groundsgg/.github/.github/workflows/docker-gradle-build-push.yml@main
    with:
      runner: >-
        ${{ github.event.repository.visibility == 'public'
            && '' || 'grounds-service-maps' }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
