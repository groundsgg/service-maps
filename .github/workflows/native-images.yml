name: Native Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile.native
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - src/**
      - lit-worker/**
      - lod-worker/**
      - lod-format/**
      - Dockerfile
      - ci/**
      - .github/workflows/native-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  native:
    uses: groundsgg/.github/.github/workflows/native-gradle-build-push.yml@7a68ed3f39c71cd0c9190182801fecc33c5a8c12
    with:
      alias-prefix: native-
      verify-command: python3 ci/verify-native.py
    secrets: inherit
