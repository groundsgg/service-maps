apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service-maps.name" . }}
  labels: {{- include "service-maps.labels" . | nindent 4 }}
# Nothing in this service talks to the Kubernetes API, so the token is only a liability.
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets: {{- toYaml . | nindent 2 }}
{{- end }}
