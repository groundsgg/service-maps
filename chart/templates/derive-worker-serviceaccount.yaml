{{- if and .Values.derive.enabled .Values.derive.worker.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.derive.worker.serviceAccount.name }}
  labels: {{- include "service-maps.labels" . | nindent 4 }}
# Jobs receive only presigned URLs. Their API token is unnecessary and secrets never belong here.
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets: {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
