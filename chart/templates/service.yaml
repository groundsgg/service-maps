apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-maps.name" . }}
  labels: {{- include "service-maps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "service-maps.selectorLabels" . | nindent 4 }}
